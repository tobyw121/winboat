name: Test Atlas Windows integration
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/test-atlas-windows.yml'
      - 'guest_server/scripts/*Atlas*'
      - 'tests/atlas-*.test.ps1'
  pull_request:
    paths:
      - 'guest_server/scripts/*Atlas*'
      - 'tests/atlas-*.test.ps1'
permissions:
  contents: read
jobs:
  atlas:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test isolated Atlas scripts and native helpers
        shell: pwsh
        run: |
          foreach ($test in @('atlas-windows','atlas-recovery','atlas-observer','atlas-helios-handoff','atlas-acl','atlas-ui','atlas-session-launcher')) {
            & '${{ matrix.shell }}' -NoProfile -File "./tests/$test.test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Atlas test failed: $test ($LASTEXITCODE)" }
          }
