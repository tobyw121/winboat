name: Test Helios QEMU D-Bus display
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/test-helios-qemu-dbus.yml'
      - 'helios/host/**'
      - 'helios/source.lock.json'
      - 'tests/helios-qemu-dbus.*'
      - 'tests/helios-qemu-device.c'
      - 'tests/helios-qemu-import-cache.c'
      - 'scripts/helios/inspect-qemu-backend.py'
      - 'tests/helios-qemu-backend.test.py'
      - 'scripts/helios/capture-display*.py'
      - 'tests/helios-display-capture.py'
      - 'tests/helios-resolutions.py'
      - 'src/shared/helios-resolution.ts'
      - 'src/shared/helios.ts'
      - 'src/renderer/views/Config.vue'
      - 'native/helios-viewer/**'
      - 'src/shared/helios-viewer.ts'
      - 'src/shared/helios-gl.ts'
      - 'src/shared/guest-protocol.ts'
      - 'src/shared/helios-display.ts'
      - 'src/renderer/lib/helios-display.ts'
      - 'src/renderer/lib/specs.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/shared/prerequisites.ts'
      - 'src/renderer/lib/winboat.ts'
      - 'src/renderer/lib/install.ts'
      - 'tests/helios-viewer*'
      - 'tests/host-environment.test.ts'
      - 'tests/native-desktop-environment.test.ts'
      - 'tests/specs.test.ts'
  pull_request:
    paths:
      - 'helios/host/**'
      - 'helios/source.lock.json'
      - 'tests/helios-qemu-dbus.*'
      - 'tests/helios-qemu-device.c'
      - 'tests/helios-qemu-import-cache.c'
      - 'scripts/helios/inspect-qemu-backend.py'
      - 'tests/helios-qemu-backend.test.py'
      - 'scripts/helios/capture-display*.py'
      - 'tests/helios-display-capture.py'
      - 'tests/helios-resolutions.py'
      - 'src/shared/helios-resolution.ts'
      - 'src/shared/helios.ts'
      - 'src/renderer/views/Config.vue'
      - 'native/helios-viewer/**'
      - 'src/shared/helios-viewer.ts'
      - 'src/shared/helios-gl.ts'
      - 'src/shared/guest-protocol.ts'
      - 'src/shared/helios-display.ts'
      - 'src/renderer/lib/helios-display.ts'
      - 'src/renderer/lib/specs.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/shared/prerequisites.ts'
      - 'src/renderer/lib/winboat.ts'
      - 'src/renderer/lib/install.ts'
      - 'tests/helios-viewer*'
      - 'tests/host-environment.test.ts'
      - 'tests/native-desktop-environment.test.ts'
      - 'tests/specs.test.ts'
permissions:
  contents: read
jobs:
  host-build:
    name: Compile patched production QEMU and host runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build full host stack including native Vulkan readback
        run: docker build --build-arg HELIOS_BUILD_JOBS=2 --target runtime -f helios/host/Dockerfile -t winboat-helios-test:drm-node .
      - name: Verify compiled patch provenance
        run: |
          docker run --rm --entrypoint cat winboat-helios-test:drm-node /opt/helios/host-patches.sha256 > /tmp/compiled-patches.sha256
          cmp helios/host/patches/SHA256SUMS /tmp/compiled-patches.sha256
          test "$(docker image inspect --format '{{index .Config.Labels "org.winboat.helios.runtime"}}' winboat-helios-test:drm-node)" = glvnd-v6
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/helios-qemu-backend.test.py
      - name: Install QEMU for display capture tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Test occupied QMP, HMP captures and restored tracing
        run: |
          python3 tests/helios-display-capture.py
          python3 tests/helios-resolutions.py
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install EGL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev libepoxy-dev libpixman-1-dev libegl-mesa0 libgl1-mesa-dri
      - name: Test pinned QEMU patches with real Mesa and protocol fixtures
        run: python3 tests/helios-qemu-dbus.py

  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install viewer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libepoxy-dev xvfb xauth dbus python3-gi libgl1-mesa-dri
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test automatic session lifecycle and optional FreeRDP
        run: npm run test:helios
      - name: Test real viewer adapter loss, fallback and recovery
        run: bash tests/helios-viewer-render.sh
