permissions:
  contents: read
jobs:
  performance-options:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/helios-backup.py
      - run: python3 tests/helios-preflight.py
      - run: python3 tests/helios-regression.py
      - run: python3 tests/helios-performance.py
      - run: cc -std=c11 -Wall -Wextra -Werror tests/helios-frame-memory.c -o /tmp/frame-memory && /tmp/frame-memory
      - run: python3 tests/helios-performance-metrics.py
      - run: python3 tests/helios-soak.py
      - run: python3 tests/helios-bisect.py
      - run: python3 tests/helios-support-export.py
      - run: python3 tests/helios-support-bundle.py
      - run: python3 tests/helios-capabilities.test.py
      - run: python3 tests/helios-symbols.py
      - run: python3 tests/helios-graphics-center.py
      - run: python3 tests/helios-graphics-trial.py
      - run: python3 tests/helios-rescue.test.py
      - run: python3 tests/helios-comparison.py
      - run: python3 scripts/helios/performance-profile.py baseline --output /tmp/baseline.json
  host-build:
    name: Compile patched production QEMU and host runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build full host stack including native Vulkan readback
        run: docker build --build-arg HELIOS_BUILD_JOBS=2 --target runtime -f helios/host/Dockerfile -t winboat-helios-test:drm-node .
      - name: Verify compiled patch provenance
        run: |
          docker run --rm --entrypoint cat winboat-helios-test:drm-node /opt/helios/host-patches.sha256 > /tmp/compiled-patches.sha256
          cmp helios/host/patches/SHA256SUMS /tmp/compiled-patches.sha256
          docker run --rm --entrypoint cat winboat-helios-test:drm-node /opt/helios/renderer-patches.sha256 > /tmp/renderer-patches.sha256
          cmp helios/host/renderer-patches/SHA256SUMS /tmp/renderer-patches.sha256
      - name: Verify actual QEMU I/O polling properties without a guest disk
        run: docker run --rm --network none -e LD_LIBRARY_PATH=/opt/helios/renderer/lib:/opt/helios/lib --entrypoint python3 -v "$PWD:/src:ro" -w /src winboat-helios-test:drm-node tests/helios-io-poll-qemu.py
      - name: Verify live disk export against real QEMU with simulated VSS
        run: docker run --rm --network none -e LD_LIBRARY_PATH=/opt/helios/renderer/lib:/opt/helios/lib --entrypoint python3 -v "$PWD:/src:ro" -w /src winboat-helios-test:drm-node tests/live-backup-qemu.py
      - name: Verify synthetic export staging with actual qemu-img conversion and comparison
        run: python3 tests/backup-stage-qemu.py winboat-helios-test:drm-node
      - name: Verify runtime capability label
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.winboat.helios.runtime"}}' winboat-helios-test:drm-node)" = glvnd-v12
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/helios-qemu-backend.test.py
      - name: Install QEMU for display capture tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Test occupied QMP, HMP captures and restored tracing
        run: |
          python3 tests/helios-display-capture.py
          python3 tests/helios-resolutions.py
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install EGL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev libepoxy-dev libpixman-1-dev libegl-mesa0 libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers
      - name: Test shared backing lifetime after producer and FD close
        run: cc -std=c11 -Wall -Wextra -Werror -pthread tests/helios-vram-refs.c -o /tmp/vram-refs && /tmp/vram-refs
      - name: Test pinned renderer memory accounting
        run: python3 tests/helios-renderer-budget.py
      - name: Test shared VRAM ledger across processes and threads
        run: cc -std=c11 -Wall -Wextra -Werror -pthread tests/helios-vram-budget.c -o /tmp/vram-budget && /tmp/vram-budget
      - name: Test real Vulkan preflight inventory and rejected DRM device
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror helios/host/gpu-preflight.c -lvulkan -o /tmp/preflight
          /tmp/preflight --inventory > /tmp/preflight.json
          python3 -c 'import json; p=json.load(open("/tmp/preflight.json")); assert p["devices"] and p["ready"] is False'
          if /tmp/preflight /dev/null; then exit 1; fi
      - name: Test pinned QEMU patches with real Mesa and protocol fixtures
        run: HELIOS_TEST_VULKAN=1 python3 tests/helios-qemu-dbus.py

  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install viewer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libepoxy-dev xvfb xauth dbus python3-gi libgl1-mesa-dri
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test automatic session lifecycle and optional FreeRDP
        run: npm run test:helios
      - name: Test real viewer adapter loss, fallback and recovery
        run: bash tests/helios-viewer-render.sh
