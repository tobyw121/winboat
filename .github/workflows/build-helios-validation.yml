name: Build Helios graphics validation tools
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/build-helios-validation.yml'
      - 'tests/helios-opengl-pixels.c'
      - 'tests/helios-format-contract.cpp'
      - 'tests/helios-capabilities.cpp'
      - 'tests/helios-shared-process.cpp'
      - 'helios/upstream/tools/d3d11_msaa_present_probe.cpp'
      - 'guest_server/scripts/Test-HeliosAcceptance.ps1'
permissions:
  contents: read
jobs:
  tools:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Vulkan headers for capability probe
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/vulkan-headers"
          git -C "$env:RUNNER_TEMP/vulkan-headers" fetch --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git 11d6898377797e07dbd543aaaa367e4465074597
          if ($LASTEXITCODE) {throw 'Vulkan headers fetch failed'}
          git -C "$env:RUNNER_TEMP/vulkan-headers" checkout --detach FETCH_HEAD
          if ((git -C "$env:RUNNER_TEMP/vulkan-headers" rev-parse HEAD) -ne '11d6898377797e07dbd543aaaa367e4465074597') {throw 'Header pin mismatch'}
      - name: Compile actual D3D11 MSAA/presentation and OpenGL pixel probes
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $cmd = Join-Path $env:RUNNER_TEMP 'validation.cmd'
          @(
            ('call "'+$vs+'\VC\Auxiliary\Build\vcvars64.bat"'),
            'if errorlevel 1 exit /b 1',
            'cl /nologo /W4 /WX /EHsc /std:c++17 /MT helios/upstream/tools/d3d11_msaa_present_probe.cpp /Fe:helios-msaa-present.exe /link d3d11.lib dxgi.lib d3dcompiler.lib user32.lib',
            'if errorlevel 1 exit /b 1',
            ('cl /nologo /W4 /WX /EHsc /std:c++17 /MT /I"'+$env:RUNNER_TEMP+'\vulkan-headers\include" tests/helios-capabilities.cpp /Fe:helios-capabilities.exe /link d3d11.lib dxgi.lib'),
            'if errorlevel 1 exit /b 1',
            'cl /nologo /W4 /WX /EHsc /std:c++17 /MT tests/helios-format-contract.cpp /Fe:helios-format-contract.exe /link d3d11.lib dxgi.lib',
            'if errorlevel 1 exit /b 1',
            'cl /nologo /W4 /WX /EHsc /std:c++17 /MT tests/helios-shared-process.cpp /Fe:helios-shared-process.exe /link d3d11.lib dxgi.lib',
            'if errorlevel 1 exit /b 1',
            'cl /nologo /W4 /WX /std:c11 /MT tests/helios-opengl-pixels.c /Fe:helios-opengl-pixels.exe /link opengl32.lib user32.lib gdi32.lib',
            'exit /b %errorlevel%'
          ) | Set-Content -Encoding ascii $cmd
          & cmd.exe /c $cmd
          if ($LASTEXITCODE) {throw 'Native probe compilation failed'}
          ./helios-msaa-present.exe --self-test
          if ($LASTEXITCODE) {throw 'MSAA pixel oracle self-test failed'}
          ./helios-capabilities.exe --warp
          if ($LASTEXITCODE) {throw 'WARP capability queries failed'}
          ./helios-format-contract.exe --warp
          if ($LASTEXITCODE) {throw 'Real WARP format/shared-resource contract failed'}
          ./helios-shared-process.exe --warp
          if ($LASTEXITCODE) {throw 'Real WARP two-device/process shared-resource contract failed'}
          $files=@('helios-capabilities.exe','helios-msaa-present.exe','helios-opengl-pixels.exe','helios-format-contract.exe','helios-shared-process.exe') | ForEach-Object {
            @{name=$_;sha256=(Get-FileHash $_ -Algorithm SHA256).Hash}
          }
          @{schema=1;sourceCommit='${{ github.sha }}';files=@($files)} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 tools.json
          (Get-FileHash tools.json -Algorithm SHA256).Hash | Set-Content tools-manifest-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: helios-validation-x64
          path: |
            helios-capabilities.exe
            helios-msaa-present.exe
            helios-opengl-pixels.exe
            helios-format-contract.exe
            helios-shared-process.exe
            tools.json
            tools-manifest-sha256.txt
