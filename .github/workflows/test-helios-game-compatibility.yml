name: Test Helios game compatibility
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/test-helios-game-compatibility.yml'
      - 'tests/helios-adapter-selection.py'
      - 'tests/helios-journal.rs'
      - 'helios/upstream/umd/src/diagnostics.rs'
      - 'helios/upstream/umd/bridge/dxvk_bridge.cpp'
      - 'helios/upstream/metadata/helios_branding.h'
      - 'helios/upstream/ci/patches/mesa/0001-guest-device-features-and-branding.patch'
      - 'tests/helios-clear-view/**'
      - 'tests/helios-game-clearview.cpp'
      - 'helios/upstream/umd/src/forward/transfer.rs'
      - 'helios/upstream/packaging/windows/probes/**'
      - 'helios/upstream/umd/src/forward/queries.rs'
      - 'helios/upstream/umd/src/forward/state.rs'
      - 'helios/upstream/umd/src/forward/views.rs'
      - 'helios/upstream/umd/src/forward/shaders.rs'
      - 'guest_server/scripts/Set-WinBoatGameCompatibility.ps1'
      - 'tests/game-compatibility.test.ps1'
      - 'guest_server/scripts/Test-WinBoatOpenGL.ps1'
      - 'tests/opengl-game-probe.test.ps1'
      - 'tests/helios-adapter-vulkan.test.ps1'
      - 'helios/upstream/packaging/windows/Helios-PackageCommon.ps1'
  pull_request:
    paths:
      - 'tests/helios-adapter-selection.py'
      - 'tests/helios-journal.rs'
      - 'helios/upstream/umd/src/diagnostics.rs'
      - 'helios/upstream/umd/bridge/dxvk_bridge.cpp'
      - 'helios/upstream/metadata/helios_branding.h'
      - 'helios/upstream/ci/patches/mesa/0001-guest-device-features-and-branding.patch'
      - 'tests/helios-clear-view/**'
      - 'tests/helios-game-clearview.cpp'
      - 'helios/upstream/umd/src/forward/transfer.rs'
      - 'helios/upstream/packaging/windows/probes/**'
      - 'helios/upstream/umd/src/forward/queries.rs'
      - 'helios/upstream/umd/src/forward/state.rs'
      - 'helios/upstream/umd/src/forward/views.rs'
      - 'helios/upstream/umd/src/forward/shaders.rs'
      - 'guest_server/scripts/Set-WinBoatGameCompatibility.ps1'
      - 'tests/game-compatibility.test.ps1'
      - 'guest_server/scripts/Test-WinBoatOpenGL.ps1'
      - 'tests/opengl-game-probe.test.ps1'
      - 'tests/helios-adapter-vulkan.test.ps1'
      - 'helios/upstream/packaging/windows/Helios-PackageCommon.ps1'
permissions:
  contents: read
jobs:
  adapter-selection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/helios-adapter-selection.py
      - name: Execute production bounded GPU journal tests
        run: |
          rustc --edition=2021 --test tests/helios-journal.rs -o /tmp/helios-journal
          /tmp/helios-journal
  clear-view:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}
      - name: Run production ClearView and MSAA helpers against native WARP
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/helios-clear-view
        run: cargo test --locked --manifest-path tests/helios-clear-view/Cargo.toml --target ${{ matrix.target }} -- --nocapture
  legacy-profile:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check app-local Direct3D 9 profiles and restoration
        shell: pwsh
        run: |
          ./tests/game-compatibility.test.ps1
          ./tests/opengl-game-probe.test.ps1
          ./tests/helios-adapter-vulkan.test.ps1
      - name: Check profiles and OpenGL probe on Windows PowerShell
        shell: powershell
        run: |
          ./tests/game-compatibility.test.ps1
          ./tests/opengl-game-probe.test.ps1
          ./tests/helios-adapter-vulkan.test.ps1
      - name: Check 32-bit OpenGL probe
        shell: pwsh
        run: |
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/opengl-game-probe.test.ps1
          if ($LASTEXITCODE -ne 0) { throw '32-bit OpenGL probe test failed.' }
  helios-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual Helios acceptance probe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ tools are missing.' }
          $script = Join-Path $env:RUNNER_TEMP 'build-clearview.cmd'
          @(
            "call `"$vs/Common7/Tools/VsDevCmd.bat`" -arch=${{ matrix.arch }} -host_arch=x64"
            'if errorlevel 1 exit /b 1'
            'cl /nologo /W4 /EHsc /std:c++17 /MT tests/helios-game-clearview.cpp /Fe:helios-clearview-${{ matrix.arch }}.exe /link d3d11.lib dxgi.lib'
            'if errorlevel 1 exit /b 1'
            'cl /nologo /W4 /EHsc /std:c++17 /MT helios/upstream/packaging/windows/probes/d3d11-smoke.cpp /Fe:helios-render-${{ matrix.arch }}.exe /link d3d11.lib dxgi.lib d3dcompiler.lib'
          ) | Set-Content -LiteralPath $script -Encoding ascii
          & $env:ComSpec /d /c $script
          if ($LASTEXITCODE -ne 0) { throw 'Helios acceptance probe compilation failed.' }
          & ./helios-render-${{ matrix.arch }}.exe --warp
          if ($LASTEXITCODE -ne 0) { throw 'WARP control: compute/draw/depth/MSAA readback failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: helios-clearview-probe-${{ matrix.arch }}
          path: |
            helios-clearview-${{ matrix.arch }}.exe
            helios-render-${{ matrix.arch }}.exe
          if-no-files-found: error
