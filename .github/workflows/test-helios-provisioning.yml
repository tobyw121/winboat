name: Test Helios provisioning
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - '.github/workflows/test-helios-provisioning.yml'
      - 'guest_server/scripts/Get-DisplayAdapters.ps1'
      - 'guest_server/graphics_monitor*'
      - 'guest_server/graphics_rescue*'
      - 'guest_server/scripts/Set-HeliosRescue.ps1'
      - 'tests/helios-rescue.test.*'
      - 'scripts/helios/rescue-graphics.py'
      - 'helios/host/display.sh'
      - 'helios/host/qemu.sh'
      - 'guest_server/graphics_desktop*'
      - 'guest_server/graphics_topology*'
      - 'guest_server/graphics_diagnostics*'
      - 'guest_server/scripts/Get-HeliosDiagnostics.ps1'
      - 'guest_server/scripts/Get-HeliosApplicationDiagnostics.ps1'
      - 'tests/helios-application-diagnostics.test.ps1'
      - 'scripts/helios/diagnose-graphics.py'
      - 'tests/helios-graphics-diagnostics.test.py'
      - 'tests/helios-diagnostics.test.ps1'
      - 'guest_server/main.go'
      - 'guest_server/scripts/Preserve-WinBoatProvisioning.ps1'
      - 'guest_server/scripts/update.ps1'
      - 'tests/guest-update-provisioning.test.ps1'
      - 'guest_server/runtime_provisioning*'
      - 'guest_server/scripts/Start-VCRedistProvisioning.ps1'
      - 'guest_server/scripts/vcredist-packages.json'
      - 'tests/vcredist-provisioning.test.ps1'
      - 'guest_server/scripts/Start-HeliosProvisioning.ps1'
      - 'guest_server/scripts/Get-WinBoatFileSha256.ps1'
      - 'guest_server/scripts/Start-AtlasHelios.ps1'
      - 'tests/display-adapters.test.ps1'
      - 'tests/helios-provisioning.test.ps1'
      - 'tests/atlas-helios-handoff.test.ps1'
  pull_request:
    paths:
      - 'guest_server/scripts/Get-DisplayAdapters.ps1'
      - 'guest_server/graphics_monitor*'
      - 'guest_server/graphics_rescue*'
      - 'guest_server/scripts/Set-HeliosRescue.ps1'
      - 'tests/helios-rescue.test.*'
      - 'scripts/helios/rescue-graphics.py'
      - 'helios/host/display.sh'
      - 'helios/host/qemu.sh'
      - 'guest_server/graphics_desktop*'
      - 'guest_server/graphics_topology*'
      - 'guest_server/graphics_diagnostics*'
      - 'guest_server/scripts/Get-HeliosDiagnostics.ps1'
      - 'guest_server/scripts/Get-HeliosApplicationDiagnostics.ps1'
      - 'tests/helios-application-diagnostics.test.ps1'
      - 'scripts/helios/diagnose-graphics.py'
      - 'tests/helios-graphics-diagnostics.test.py'
      - 'tests/helios-diagnostics.test.ps1'
      - 'guest_server/main.go'
      - 'guest_server/scripts/Preserve-WinBoatProvisioning.ps1'
      - 'guest_server/scripts/update.ps1'
      - 'tests/guest-update-provisioning.test.ps1'
      - 'guest_server/runtime_provisioning*'
      - 'guest_server/scripts/Start-VCRedistProvisioning.ps1'
      - 'guest_server/scripts/vcredist-packages.json'
      - 'tests/vcredist-provisioning.test.ps1'
      - 'guest_server/scripts/Start-HeliosProvisioning.ps1'
      - 'guest_server/scripts/Get-WinBoatFileSha256.ps1'
      - 'guest_server/scripts/Start-AtlasHelios.ps1'
      - 'tests/display-adapters.test.ps1'
      - 'tests/helios-provisioning.test.ps1'
      - 'tests/atlas-helios-handoff.test.ps1'
permissions:
  contents: read
jobs:
  rescue-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check VGA-only rescue arguments and preserved storage configuration
        run: python3 tests/helios-rescue.test.py
  provisioning:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test provisioning and handoff (PowerShell 7)
        shell: pwsh
        run: |
          ./tests/guest-update-provisioning.test.ps1
          ./tests/vcredist-provisioning.test.ps1
          ./tests/display-adapters.test.ps1
          ./tests/helios-rescue.test.ps1
          ./tests/helios-diagnostics.test.ps1
          ./tests/helios-application-diagnostics.test.ps1
          ./tests/helios-provisioning.test.ps1
          ./tests/atlas-helios-handoff.test.ps1
      - name: Test provisioning and handoff (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./tests/guest-update-provisioning.test.ps1
          ./tests/vcredist-provisioning.test.ps1
          ./tests/display-adapters.test.ps1
          ./tests/helios-rescue.test.ps1
          ./tests/helios-diagnostics.test.ps1
          ./tests/helios-application-diagnostics.test.ps1
          ./tests/helios-provisioning.test.ps1
          ./tests/atlas-helios-handoff.test.ps1
      - name: Read real Windows kernel and driver diagnostics without changing configuration
        shell: powershell
        run: |
          $data = (& ./guest_server/scripts/Get-HeliosDiagnostics.ps1) | ConvertFrom-Json
          if ($data.testSigning -isnot [bool]) {throw 'Active kernel signing query did not execute.'}
          if ($null -eq $data.driverRegistry) {throw 'Driver diagnostics JSON is incomplete.'}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: guest_server/go.sum
      - name: Check host-side graphics collector
        shell: pwsh
        run: python tests/helios-graphics-diagnostics.test.py
      - name: Test and compile Windows Guest API
        working-directory: guest_server
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          go build -o "$env:RUNNER_TEMP/winboat_guest_server.exe" .
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}

  runtimes:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Microsoft payloads and install missing runtimes on disposable Windows
        shell: powershell
        run: |
          . ./guest_server/scripts/Start-VCRedistProvisioning.ps1 -LibraryOnly
          $cache = Join-Path $env:RUNNER_TEMP 'winboat-vcredist'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $packages = @(Get-VCRedistPackages)
          # Check all payload hashes/signatures, even when the runner already
          # has a newer compatible runtime and installation would be skipped.
          foreach ($package in $packages) { Get-VCRedistInstaller $package $cache | Out-Null }
          Invoke-VCRedistPackages $packages $cache | ConvertTo-Json -Depth 5
